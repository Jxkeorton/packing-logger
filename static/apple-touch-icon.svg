<!--
  Master artwork for static/apple-touch-icon.png AND the two Android home
  -screen sizes (static/android-chrome-{192x192,512x512}.png, referenced
  from static/manifest.webmanifest) — keep all three PNGs in sync with
  this file. Neither platform accepts an SVG icon directly. Regenerate:
    qlmanage -t -s 180 -o /tmp static/apple-touch-icon.svg
    cp /tmp/apple-touch-icon.svg.png static/apple-touch-icon.png
  Then upscale that PNG for Android rather than re-running qlmanage at
  192/512 — past 180px its SVG thumbnailer stops filling the frame and
  pads the canvas with white instead (a quirk of qlmanage, not of this
  artwork):
    sips -z 192 192 static/apple-touch-icon.png --out static/android-chrome-192x192.png
    sips -z 512 512 static/apple-touch-icon.png --out static/android-chrome-512x512.png

  Same parachute as favicon.svg, adapted for a home-screen tile:
   - Opaque background. iOS composites transparency onto black (a
     transparent icon would render as a black square), and this shape
     was never redrawn as a maskable icon for Android's adaptive-icon
     safe zone, so it stays opaque and un-masked there too — Chrome
     falls back to showing it as a plain square/rounded-square tile.
   - Square corners, drawn full-bleed. iOS applies its own squircle mask;
     pre-rounding the corners would double up and look wrong.
   - Artwork inset to the middle ~68%, so that mask never clips it.
   - Heavier strokes than the favicon, to stay legible at tile size.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 180 180" width="180" height="180">
  <rect width="180" height="180" fill="#122c41"/>
  <g transform="translate(19.6 19.6) scale(2.2)" fill="none" stroke-linecap="round">
    <!-- canopy -->
    <path d="M4 30C4 16 16 6 32 6s28 10 28 24" stroke="#4fb6e0" stroke-width="4"/>
    <!-- rigging lines -->
    <path d="M4 30 L18 40 M32 30 L32 44 M60 30 L46 40 M20 30 L26 42 M44 30 L38 42" stroke="#dceaf0" stroke-width="2.5"/>
    <!-- jumper -->
    <path d="M17 41c1 6 6 9 15 9s14-3 15-9" stroke="#dceaf0" stroke-width="2.5"/>
    <rect x="27" y="49" width="10" height="9" rx="2" fill="#1e9678" stroke="none"/>
  </g>
</svg>
