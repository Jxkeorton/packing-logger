<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover" />
		<meta name="theme-color" content="#122c41" />
		<!--
			iOS home-screen icon. Deliberately a literal /static path rather than a
			bundled import like the favicon in +layout.svelte: iOS also probes this
			exact filename at the site root as a fallback, which a hashed asset
			filename would defeat. See static/apple-touch-icon.svg for the master
			artwork and how to regenerate the PNG.
		-->
		<link rel="apple-touch-icon" href="/apple-touch-icon.png" />
		<!-- Short label shown under the icon on the home screen. -->
		<meta name="apple-mobile-web-app-title" content="Packing Log" />
		<!--
			Tells iOS to treat the Home Screen icon as a real standalone app
			rather than a lightweight bookmark shortcut. Without this, the
			login cookie has been reported not to survive being closed and
			reopened from the Home Screen — the icon needs to be removed and
			re-added after this change for it to take effect; it's read only
			at "Add to Home Screen" time, not retroactively.
		-->
		<meta name="apple-mobile-web-app-capable" content="yes" />
		<!--
			Android's equivalent of the two tags above: Chrome's "Add to Home
			screen" reads the icon and name from the manifest rather than a
			link/meta pair. See static/manifest.webmanifest and
			static/apple-touch-icon.svg (the shared master artwork for both
			platforms' icons).
		-->
		<link rel="manifest" href="/manifest.webmanifest" />
		<title>Packing Log</title>
		<meta name="description" content="Daily pack job and tandem jump counter and earnings log for a skydive rigger." />
		<link rel="preconnect" href="https://fonts.googleapis.com" />
		<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
		<link
			href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;600&display=swap"
			rel="stylesheet"
		/>
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover" class="m-0 bg-canvas text-ink font-sans min-h-dvh antialiased">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
